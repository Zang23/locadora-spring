services:
  mariadb:
    image: mariadb:latest
    container_name: locadoradb
    restart: unless-stopped

    environment:
      MARIADB_ROOT_PASSWORD: 123456
      MARIADB_DATABASE: locflix
      MARIADB_USER: admin
      MARIADB_PASSWORD: 123456

    ports:
      - "3306:3306"

    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data:
